services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waga
      POSTGRES_USER: waga
      POSTGRES_PASSWORD: waga
    ports:
      - "5432:5432"
    volumes:
      - waga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waga -d waga"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  waga_postgres_data:
